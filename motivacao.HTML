    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: #1a1a1a;
            border: 2px solid #e30613;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            padding: 20px 40px;
            max-width: 1000px;
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #fff;
        }

            color: #e30613;
        }

        p {
            font-size: 2.4rem;
            margin: 20px 0;
            color: #d3d3d3;
        }

        footer {
            font-size: 1.8rem;
            color: #d3d3d3;
            margin-top: 20px;
        }

        /* Estilo da barra de progresso */
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 20px;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #e30613;
            transition: width 0.15s linear;
        }
    </style>
</head>

        function exibirFraseMotivacional() {
            const indice = Math.floor(Math.random() * frases.length);
            document.getElementById("frase").textContent = frases[indice];
        }

        function animarBarraDeProgresso() {
            const progressBar = document.getElementById("progress-bar");
            let width = 0;
            progressBar.style.width = "0%";

            const interval = setInterval(() => {
                width += 1;
                progressBar.style.width = width + "%";

                if (width >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        exibirFraseMotivacional();
                        animarBarraDeProgresso();
                    }, 500);
                }
            }, 150); // Ajuste este valor para controlar a velocidade da animação
        }

        function iniciarAnimacao() {
            exibirFraseMotivacional();
            animarBarraDeProgresso();
        }
